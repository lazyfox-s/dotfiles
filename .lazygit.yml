customCommands:
  - key: 'C'
    command: >-
      git commit -m "{{ .Form.Type }}{{ if .Form.Scope }}({{ .Form.Scope }}){{ end }}: {{ .Form.Subject }}"
    context: 'files'
    description: 'Commit with conventional / emoji prefix'
    prompts:
      - type: 'menu'
        title: 'Select Commit Type'
        key: 'Type'
        options:
          - name: '✨ add      - プラグイン、新設定、キーマップ等の追加'
            value: '✨ add'
          - name: '🔧 change   - 既存の設定値・オプションの変更'
            value: '🔧 change'
          - name: '🔥 remove   - 不要になった設定、プラグインの削除'
            value: '🔥 remove'
          - name: '🐛 fix      - エラーの解消、壊れた設定の修正'
            value: '🐛 fix'
          - name: '⚡️ perf     - 起動高速化、遅延読み込み等の改善'
            value: '⚡️ perf'
          - name: '🎨 style    - カラースキーム、フォント等の外見'
            value: '🎨 style'
          - name: '♻️ refactor - 設定ファイルの分割・モジュール化'
            value: '♻️ refactor'
          - name: '⬆️ update   - バージョン・Lockファイルの更新'
            value: '⬆️ update'
          - name: '📦 setup    - chezmoi設定、インストールスクリプト'
            value: '📦 setup'
          - name: '📝 docs     - READMEやドキュメント類の修正'
            value: '📝 docs'
      - type: 'input'
        title: 'Enter Scope (optional, e.g. nvim, fish, starship)'
        key: 'Scope'
      - type: 'input'
        title: 'Enter Subject (commit message)'
        key: 'Subject'
